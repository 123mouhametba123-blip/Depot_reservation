services:
  db:
    image: mysql:8.0
    container_name: reservation_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-reservation_salles}
      MYSQL_USER: ${DB_USERNAME:-reservation_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-reservation_pass}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build: .
    container_name: reservation_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-reservation_salles}
      DB_USERNAME: ${DB_USERNAME:-reservation_user}
      DB_PASSWORD: ${DB_PASSWORD:-reservation_pass}
    ports:
      - "8080:80"

volumes:
  db_data:
