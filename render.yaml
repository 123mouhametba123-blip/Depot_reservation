services:
  - type: web
    name: reservation-salles
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_DRIVER
        value: mysql
      # Render ne fournit pas de MySQL managé : remplissez ces variables dans
      # le dashboard (Environment) avec les identifiants d'une base MySQL
      # externe (ex. Clever Cloud, Aiven, DigitalOcean...).
      # - key: DB_HOST
      #   sync: false
      # - key: DB_PORT
      #   sync: false
      # - key: DB_DATABASE
      #   sync: false
      # - key: DB_USERNAME
      #   sync: false
      # - key: DB_PASSWORD
      #   sync: false