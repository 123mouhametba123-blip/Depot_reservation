server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Front controller : toute URL qui ne correspond pas à un fichier
    # ou répertoire existant est transmise à public/index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Exécution des scripts PHP via PHP-FPM (127.0.0.1:9000).
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Protéger fichiers sensibles : fichiers cachés et .env.
    location ~ /\. {
        deny all;
    }
    location ~ \.env$ {
        deny all;
    }

    # Cache des assets statiques.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}